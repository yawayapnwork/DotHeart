org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Explicit even though AGP 7.0+ already defaults to this - the extra -keep
# rules in app/proguard-rules.pro are written assuming full mode's more
# aggressive reflection-blind stripping, so this is pinned rather than
# relying on a default that could change in a future AGP version.
android.enableR8.fullMode=true
